apply plugin: 'com.android.application'

// Optional owner signing material must stay outside the public repository.
def ownerKeystore = System.getenv('DRONELAB_KEYSTORE')

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    namespace "com.duvitech.tello"
    defaultConfig {
        applicationId "com.montel.tellono.a54.test"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 9
        versionName "2.5.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        if (ownerKeystore) {
            ownerSigning {
                storeFile rootProject.file(ownerKeystore)
                storePassword System.getenv('DRONELAB_STORE_PASSWORD')
                keyAlias System.getenv('DRONELAB_KEY_ALIAS')
                keyPassword System.getenv('DRONELAB_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (ownerKeystore) signingConfig signingConfigs.ownerSigning
        }
        release {
            if (ownerKeystore) signingConfig signingConfigs.ownerSigning
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
